version: 2.1
orbs:
  node: circleci/node@6.3.0
  browser-tools: circleci/browser-tools@1.5.3
  slack: circleci/slack@4.15.0
parameters:
  testEnvironment:
    type: string
    default: 'qa2'
  testExecKey:
    type: string
    default: 'none'
  testTags:
    type: string
    default: ''
  xrayProjectKey:
    type: string
    default: 'SAND'
jobs:
  code-quality-check:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - node/install
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Run ESLint and TypeScript Check
          command: npm run check
  test:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: mcr.microsoft.com/playwright:v1.54.1-noble
    parallelism: 4
    steps:
      - checkout
      - node/install
      - run: node --version
      # Pipeline parameters override project env vars only when explicitly provided
      - run:
          name: Set environment variables
          command: |
            echo "export TARGET_ENV=\"${TARGET_ENV:-<< pipeline.parameters.testEnvironment >>}\"" >> $BASH_ENV
            echo "export TEST_EXECUTION_KEY=\"${TEST_EXECUTION_KEY:-<< pipeline.parameters.testExecKey >>}\"" >> $BASH_ENV
            echo "export TEST_TAGS=\"${TEST_TAGS:-<< pipeline.parameters.testTags >>}\"" >> $BASH_ENV
            echo "export XRAY_PROJECT_KEY=\"${XRAY_PROJECT_KEY:-<< pipeline.parameters.xrayProjectKey >>}\"" >> $BASH_ENV
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}

      # Install Playwright browsers and dependencies
      - run:
          name: Install Playwright Dependencies
          command: npx playwright install --with-deps

      # Debug: list tests to verify grep matching
      - run:
          name: Debug - List tests with grep
          command: |
            echo "TEST_TAGS=$TEST_TAGS"
            echo "--- All tests (first 10) ---"
            npx playwright test --list 2>&1 | head -10
            echo ""
            echo "--- Tests matching --grep @patient (CLI) ---"
            npx playwright test --list --grep @patient 2>&1 | head -10
            echo ""
            echo "--- Tests matching --grep patient (no @, CLI) ---"
            npx playwright test --list --grep patient 2>&1 | head -10

      # Run tests with parallel execution
      - run:
          name: Run Playwright Tests
          command: npm test -- --shard=$((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL

      # Store test results and artifacts
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results

      # Only send notifications from the first node to avoid duplicates
      - when:
          condition:
            equal: ["0", "${CIRCLE_NODE_INDEX}"]
          steps:
            - slack/notify:
                event: fail
                branch_pattern: main
                mentions: '<@UG56AQFK2>'
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":x: *Tidepool Web UI Tests Failed on Main Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                        }
                      }
                    ]
                  }
            - slack/notify:
                event: pass
                branch_pattern: main
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":white_check_mark: *Tidepool Web UI Tests Passed on Main Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                        }
                      }
                    ]
                  }
            - slack/notify:
                event: fail
                branch_pattern: develop
                mentions: '<@UG56AQFK2>'
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":x: *Tidepool Web UI Tests Failed on Develop Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                        }
                      }
                    ]
                  }
            - slack/notify:
                event: pass
                branch_pattern: develop
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":white_check_mark: *Tidepool Web UI Tests Passed on Develop Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                        }
                      }
                    ]
                  }

  scheduled-test:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: mcr.microsoft.com/playwright:v1.54.1-noble
    parallelism: 4
    steps:
      - checkout
      - node/install
      - run: node --version
      # Pipeline parameters override project env vars only when explicitly provided
      - run:
          name: Set environment variables
          command: |
            echo "export TARGET_ENV=\"${TARGET_ENV:-<< pipeline.parameters.testEnvironment >>}\"" >> $BASH_ENV
            echo "export TEST_EXECUTION_KEY=\"${TEST_EXECUTION_KEY:-<< pipeline.parameters.testExecKey >>}\"" >> $BASH_ENV
            echo "export TEST_TAGS=\"${TEST_TAGS:-<< pipeline.parameters.testTags >>}\"" >> $BASH_ENV
            echo "export XRAY_PROJECT_KEY=\"${XRAY_PROJECT_KEY:-<< pipeline.parameters.xrayProjectKey >>}\"" >> $BASH_ENV
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}

      # Install Playwright browsers and dependencies
      - run:
          name: Install Playwright Dependencies
          command: npx playwright install --with-deps

      # Run tests with parallel execution
      - run:
          name: Run Playwright Tests
          command: npm test -- --shard=$((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL

      # Store test results and artifacts
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results

      # Only send notifications from the first node to avoid duplicates
      - when:
          condition:
            equal: ["0", "${CIRCLE_NODE_INDEX}"]
          steps:
            - slack/notify:
                event: fail
                mentions: '<@UG56AQFK2>'
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*:x: Scheduled Tidepool Web UI Tests Failed* :sad_tapani: \n\n :pencil:*Summary* \n\n *$PASSED_TESTS/$TOTAL_TESTS* tests passed \n *$FAILURES* tests failed \n Total time: *$TIME* seconds"
                        }
                      },
                      {
                        "type": "divider"
                      },
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":link: *<${CIRCLE_BUILD_URL}|View CircleCI Build Details>*"
                        }
                      }
                    ]
                  }
            - slack/notify:
                event: pass
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*:white_check_mark: Scheduled Tidepool Web UI Tests Passed!* :catjam:  \n\n :pencil:*Summary:* \n *$PASSED_TESTS/$TOTAL_TESTS* tests passed \n Total time: *$TIME* seconds \n\n :link: *<${CIRCLE_BUILD_URL}|View CircleCI Build Details>*"
                        }
                      }
                    ]
                  }

workflows:
  commit-workflow:
    jobs:
      - code-quality-check
      - test
