version: 2.1
orbs:
  node: circleci/node@7.2.0
  browser-tools: circleci/browser-tools@1.5.1
  slack: circleci/slack@4.1
parameters:
  testEnvironment:
    type: string
    default: 'qa2'
  testExecKey:
    type: string
    default: 'none'
  testTags:
    type: string
    default: ''
  xrayProjectKey:
    type: string
    default: 'QAE'
jobs:
  code-quality-check:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - node/install
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Run ESLint and TypeScript Check
          command: npm run check
  create-execution:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - node/install
      # Pipeline parameters always take precedence over project-level env vars
      - run:
          name: Set environment variables
          command: |
            echo "export TARGET_ENV=\"<< pipeline.parameters.testEnvironment >>\"" >> $BASH_ENV
            echo "export TEST_EXECUTION_KEY=\"<< pipeline.parameters.testExecKey >>\"" >> $BASH_ENV
            echo "export TEST_TAGS=\"<< pipeline.parameters.testTags >>\"" >> $BASH_ENV
            echo "export XRAY_PROJECT_KEY=\"<< pipeline.parameters.xrayProjectKey >>\"" >> $BASH_ENV
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}
      # Pre-create (frontload) the Xray execution BEFORE any tests run, so a user who
      # triggered the automation from a Jira ticket sees the queued tests (status TO DO,
      # with their existing step definitions) during the run rather than only after it.
      # Uses `playwright test --list` (no browsers needed) to learn which tests will run
      # from the tag filter. Non-fatal by design: the script never exits non-zero, so a
      # frontload hiccup won't block the test job — the post-run upload auto-creates a
      # fresh execution as a fallback. The new execution's key is written to
      # test-results/created-exec-key.txt and handed to merge-and-upload-xray.
      - run:
          name: Pre-create (frontload) Xray execution
          command: npm run create-execution
      # Guarantee the dir exists even when the frontload is skipped (e.g. testExecKey=none
      # on a plain commit), so persisting the workspace never fails on a missing path.
      - run:
          name: Ensure test-results dir exists
          command: mkdir -p test-results
      - persist_to_workspace:
          root: .
          paths:
            - test-results
  test:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: mcr.microsoft.com/playwright:v1.57.0-noble
    parallelism: 4
    steps:
      - checkout
      - node/install
      - run: node --version
      # Pipeline parameters always take precedence over project-level env vars
      - run:
          name: Set environment variables
          command: |
            echo "export TARGET_ENV=\"<< pipeline.parameters.testEnvironment >>\"" >> $BASH_ENV
            echo "export TEST_EXECUTION_KEY=\"<< pipeline.parameters.testExecKey >>\"" >> $BASH_ENV
            echo "export TEST_TAGS=\"<< pipeline.parameters.testTags >>\"" >> $BASH_ENV
            echo "export XRAY_PROJECT_KEY=\"<< pipeline.parameters.xrayProjectKey >>\"" >> $BASH_ENV
            # Shards must NOT upload to Xray individually — they would hit the same
            # execution concurrently and trigger HTTP 500. The merge-and-upload-xray
            # job uploads the merged results once instead.
            echo "export XRAY_DEFER_UPLOAD=\"true\"" >> $BASH_ENV
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}

      # Install Playwright browsers and dependencies
      - run:
          name: Install Playwright Dependencies
          command: npx playwright install --with-deps

      # Run tests with parallel execution and optional tag filtering.
      # NOTE: this step intentionally does NOT fail on test failures. If it did, the
      # job would fail and the downstream merge-and-upload-xray job (requires: test)
      # would be skipped — so results would never reach Xray exactly when tests fail.
      # The real pass/fail verdict is decided in merge-and-upload-xray from the merged
      # results. (This also guarantees blob reports persist even on failing runs.)
      - run:
          name: Run Playwright Tests
          command: |
            SHARD_ARG="--shard=$((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL"
            if [ -n "$TEST_TAGS" ]; then
              TAG=$(echo "$TEST_TAGS" | tr '[:upper:]' '[:lower:]')
              [[ "$TAG" != @* ]] && TAG="@${TAG}"
              npm test -- $SHARD_ARG --grep "$TAG" --grep-invert "@wip" || echo "⚠️ Playwright reported failures — continuing so results merge & upload; verdict decided in merge-and-upload-xray."
            else
              npm test -- $SHARD_ARG --grep "@" --grep-invert "@wip" || echo "⚠️ Playwright reported failures — continuing so results merge & upload; verdict decided in merge-and-upload-xray."
            fi

      # Store test results and artifacts
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results

      # Hand each shard's blob report to the merge-and-upload job. Playwright names
      # blob files per shard (report-1.zip, report-2.zip, …) so they don't collide.
      - persist_to_workspace:
          root: .
          paths:
            - blob-report

  scheduled-test:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: mcr.microsoft.com/playwright:v1.57.0-noble
    parallelism: 4
    steps:
      - checkout
      - node/install
      - run: node --version
      # Pipeline parameters always take precedence over project-level env vars
      - run:
          name: Set environment variables
          command: |
            echo "export TARGET_ENV=\"<< pipeline.parameters.testEnvironment >>\"" >> $BASH_ENV
            echo "export TEST_EXECUTION_KEY=\"<< pipeline.parameters.testExecKey >>\"" >> $BASH_ENV
            echo "export TEST_TAGS=\"<< pipeline.parameters.testTags >>\"" >> $BASH_ENV
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}

      # Install Playwright browsers and dependencies
      - run:
          name: Install Playwright Dependencies
          command: npx playwright install --with-deps

      # Run tests with parallel execution and optional tag filtering
      - run:
          name: Run Playwright Tests
          command: |
            SHARD_ARG="--shard=$((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL"
            if [ -n "$TEST_TAGS" ]; then
              TAG=$(echo "$TEST_TAGS" | tr '[:upper:]' '[:lower:]')
              [[ "$TAG" != @* ]] && TAG="@${TAG}"
              npm test -- $SHARD_ARG --grep "$TAG" --grep-invert "@wip"
            else
              npm test -- $SHARD_ARG --grep "@" --grep-invert "@wip"
            fi

      # Store test results and artifacts
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results

      # Only send notifications from the first node to avoid duplicates
      - when:
          condition:
            equal: ["0", "${CIRCLE_NODE_INDEX}"]
          steps:
            - slack/notify:
                event: fail
                mentions: '<@UG56AQFK2>'
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*:x: Scheduled Tidepool Web UI Tests Failed* :sad_tapani: \n\n :pencil:*Summary* \n\n *$PASSED_TESTS/$TOTAL_TESTS* tests passed \n *$FAILURES* tests failed \n Total time: *$TIME* seconds"
                        }
                      },
                      {
                        "type": "divider"
                      },
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":link: *<${CIRCLE_BUILD_URL}|View CircleCI Build Details>*"
                        }
                      }
                    ]
                  }
            - slack/notify:
                event: pass
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*:white_check_mark: Scheduled Tidepool Web UI Tests Passed!* :catjam:  \n\n :pencil:*Summary:* \n *$PASSED_TESTS/$TOTAL_TESTS* tests passed \n Total time: *$TIME* seconds \n\n :link: *<${CIRCLE_BUILD_URL}|View CircleCI Build Details>*"
                        }
                      }
                    ]
                  }

  merge-and-upload-xray:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - checkout
      - node/install
      - run:
          name: Set environment variables
          command: |
            echo "export TARGET_ENV=\"<< pipeline.parameters.testEnvironment >>\"" >> $BASH_ENV
            echo "export TEST_EXECUTION_KEY=\"<< pipeline.parameters.testExecKey >>\"" >> $BASH_ENV
            echo "export XRAY_PROJECT_KEY=\"<< pipeline.parameters.xrayProjectKey >>\"" >> $BASH_ENV
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      # Pull every shard's blob report (report-1.zip … report-4.zip) into blob-report/
      - attach_workspace:
          at: .
      - run:
          name: Merge shard blob reports into one JSON
          command: npm run merge-reports
      # Don't fail this step directly: a failed step skips everything after it,
      # including store_artifacts — exactly when the xray-execution.json and failed
      # request/response debug files in test-results/ are needed. Record the failure
      # and fail the job AFTER artifacts are stored.
      - run:
          name: Upload merged results to Xray (single upload)
          command: npm run upload-to-xray || touch .xray-upload-failed
      - store_artifacts:
          path: test-results
      - run:
          name: Fail job if Xray upload failed
          command: |
            if [ -f .xray-upload-failed ]; then
              echo "❌ Xray upload failed — see the test-results artifacts (xray-execution.json, xray-failed-request/response files) for the exact payload and Xray's response."
              exit 1
            fi
      # Decide the run's verdict here (the test job always succeeds so the upload can
      # run). Fail the job — and the pipeline — if any test failed unexpectedly.
      - run:
          name: Report test verdict
          command: npm run test-verdict
      # Slack notifications live here because this job's status reflects the real
      # pass/fail verdict. event: fail/pass map to on_fail/on_success internally.
      - slack/notify:
          event: fail
          branch_pattern: main
          mentions: '<@UG56AQFK2>'
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Tidepool Web UI Tests Failed on Main Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                  }
                }
              ]
            }
      - slack/notify:
          event: pass
          branch_pattern: main
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Tidepool Web UI Tests Passed on Main Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                  }
                }
              ]
            }
      - slack/notify:
          event: fail
          branch_pattern: develop
          mentions: '<@UG56AQFK2>'
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Tidepool Web UI Tests Failed on Develop Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                  }
                }
              ]
            }
      - slack/notify:
          event: pass
          branch_pattern: develop
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Tidepool Web UI Tests Passed on Develop Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                  }
                }
              ]
            }

workflows:
  commit-workflow:
    jobs:
      - code-quality-check
      # Frontload the Xray execution before the shards run, so the triggering Jira
      # ticket shows the queued tests during the run (see the create-execution job).
      - create-execution
      - test:
          requires:
            - create-execution
      # merge-and-upload-xray attaches the workspace, which (via the create-execution
      # → test → merge ancestry) includes test-results/created-exec-key.txt — so the
      # single upload imports results INTO the frontload execution.
      - merge-and-upload-xray:
          requires:
            - test
