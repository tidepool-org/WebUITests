version: 2.1
orbs:
  node: circleci/node@6.1.0
  browser-tools: circleci/browser-tools@1.5.1
  slack: circleci/slack@4.1
parameters:
  testEnvironment:
    type: string
    default: 'qa1'
  testExecKey:
    type: string
    default: 'none'
  testTags:
    type: string
    default: ''
  xrayProjectKey:
    type: string
    default: 'SAND'
jobs:
  code-quality-check:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - node/install
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Run ESLint and TypeScript Check
          command: npm run check
  test:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: mcr.microsoft.com/playwright:v1.54.1-noble
    parallelism: 4
    environment:
      TEST_EXECUTION_KEY: << pipeline.parameters.testExecKey >>
      TARGET_ENV: << pipeline.parameters.testEnvironment >>
      TEST_TAGS: << pipeline.parameters.testTags >>
      XRAY_PROJECT_KEY: << pipeline.parameters.xrayProjectKey >>
    steps:
      - checkout
      - node/install
      - run: node --version
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}

      # Install Playwright browsers and dependencies
      - run:
          name: Install Playwright Dependencies
          command: npx playwright install --with-deps

      # Run tests with parallel execution
      # TARGET_ENV and TEST_TAGS are already set as environment variables above
      - run:
          name: Run Playwright Tests
          command: npm test -- --shard=$((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL

      # Store test results and artifacts
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results

      # Only send notifications from the first node to avoid duplicates
      - when:
          condition:
            equal: ["0", "${CIRCLE_NODE_INDEX}"]
          steps:
            - slack/notify:
                event: fail
                branch_pattern: main
                mentions: '<@UG56AQFK2>'
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":x: *Tidepool Web UI Tests Failed on Main Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                        }
                      }
                    ]
                  }
            - slack/notify:
                event: pass
                branch_pattern: main
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":white_check_mark: *Tidepool Web UI Tests Passed on Main Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                        }
                      }
                    ]
                  }
            - slack/notify:
                event: fail
                branch_pattern: develop
                mentions: '<@UG56AQFK2>'
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":x: *Tidepool Web UI Tests Failed on Develop Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                        }
                      }
                    ]
                  }
            - slack/notify:
                event: pass
                branch_pattern: develop
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":white_check_mark: *Tidepool Web UI Tests Passed on Develop Branch* \n\n:link: <${CIRCLE_BUILD_URL}|View Build Details>"
                        }
                      }
                    ]
                  }

  scheduled-test:
    working_directory: ~/tidepool-org/webuitests
    docker:
      - image: mcr.microsoft.com/playwright:v1.54.1-noble
    parallelism: 4
    environment:
      TEST_EXECUTION_KEY: << pipeline.parameters.testExecKey >>
      TARGET_ENV: << pipeline.parameters.testEnvironment >>
      TEST_TAGS: << pipeline.parameters.testTags >>
      XRAY_PROJECT_KEY: << pipeline.parameters.xrayProjectKey >>
    steps:
      - checkout
      - node/install
      - run: node --version
      - restore_cache:
          keys:
            - dependency-cache-{{ checksum "package.json" }}
            - dependency-cache-
      - run: npm ci
      - save_cache:
          paths:
            - ./node_modules
          key: dependency-cache-{{ checksum "package.json" }}

      # Install Playwright browsers and dependencies
      - run:
          name: Install Playwright Dependencies
          command: npx playwright install --with-deps

      # Run tests with parallel execution
      # TARGET_ENV and TEST_TAGS are already set as environment variables above
      - run:
          name: Run Playwright Tests
          command: npm test -- --shard=$((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL

      # Store test results and artifacts
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results

      # Only send notifications from the first node to avoid duplicates
      - when:
          condition:
            equal: ["0", "${CIRCLE_NODE_INDEX}"]
          steps:
            - slack/notify:
                event: fail
                mentions: '<@UG56AQFK2>'
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*:x: Scheduled Tidepool Web UI Tests Failed* :sad_tapani: \n\n :pencil:*Summary* \n\n *$PASSED_TESTS/$TOTAL_TESTS* tests passed \n *$FAILURES* tests failed \n Total time: *$TIME* seconds"
                        }
                      },
                      {
                        "type": "divider"
                      },
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": ":link: *<${CIRCLE_BUILD_URL}|View CircleCI Build Details>*"
                        }
                      }
                    ]
                  }
            - slack/notify:
                event: pass
                custom: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*:white_check_mark: Scheduled Tidepool Web UI Tests Passed!* :catjam:  \n\n :pencil:*Summary:* \n *$PASSED_TESTS/$TOTAL_TESTS* tests passed \n Total time: *$TIME* seconds \n\n :link: *<${CIRCLE_BUILD_URL}|View CircleCI Build Details>*"
                        }
                      }
                    ]
                  }

workflows:
  commit-workflow:
    jobs:
      - code-quality-check
      - test
